<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição - Clube de Fotografia</title>
</head>
<body>
  <header>
    <p>Clube de Fotografia</p>
    <nav aria-label="Navegação principal">
      <a href="sobre-mim.html">Sobre mim</a>
    </nav>
  </header>

  <main>
    <h1>Inscrição</h1>
    <p>Os campos obrigatórios estão assinalados com «(obrigatório)».</p>

    <form action="#" method="post">
      <p>
        <label for="nome">Nome (obrigatório)</label><br>
        <input type="text" id="nome" name="nome" autocomplete="name" required>
      </p>

      <p>
        <label for="email">Email (obrigatório)</label><br>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </p>

      <p>
        <label for="telemovel">Telemóvel (opcional)</label><br>
        <input type="tel" id="telemovel" name="telemovel" autocomplete="tel">
      </p>

      <p>
        <label for="curso">Curso (obrigatório)</label><br>
        <select id="curso" name="curso" required>
          <option value="">Escolhe o teu curso</option>
          <option value="engenharia-informatica">Engenharia Informática</option>
          <option value="design">Design</option>
          <option value="gestao">Gestão</option>
          <option value="biologia">Biologia</option>
          <option value="outro">Outro</option>
        </select>
      </p>

      <fieldset>
        <legend>Ano (obrigatório)</legend>
        <p>
          <input type="radio" id="ano-1" name="ano" value="1" required>
          <label for="ano-1">1.º</label>
        </p>
        <p>
          <input type="radio" id="ano-2" name="ano" value="2">
          <label for="ano-2">2.º</label>
        </p>
        <p>
          <input type="radio" id="ano-3" name="ano" value="3">
          <label for="ano-3">3.º</label>
        </p>
      </fieldset>

      <fieldset>
        <legend>Interesses (opcional)</legend>
        <p>
          <input type="checkbox" id="int-retrato" name="interesses" value="retrato">
          <label for="int-retrato">Retrato</label>
        </p>
        <p>
          <input type="checkbox" id="int-paisagem" name="interesses" value="paisagem">
          <label for="int-paisagem">Paisagem</label>
        </p>
        <p>
          <input type="checkbox" id="int-rua" name="interesses" value="rua">
          <label for="int-rua">Fotografia de rua</label>
        </p>
        <p>
          <input type="checkbox" id="int-edicao" name="interesses" value="edicao">
          <label for="int-edicao">Edição</label>
        </p>
      </fieldset>

      <p>
        <label for="motivacao">Porque queres entrar no clube? (opcional)</label><br>
        <textarea id="motivacao" name="motivacao" rows="5" cols="40" aria-describedby="motivacao-ajuda"></textarea><br>
        <small id="motivacao-ajuda">Escreve algumas linhas sobre o que esperas do clube. Não precisa de ser longo.</small>
      </p>

      <p>
        <input type="checkbox" id="consentimento" name="consentimento" required>
        <label for="consentimento">Autorizo o uso dos meus dados apenas para gerir a inscrição (obrigatório)</label>
      </p>

      <p>
        <button type="submit">Enviar inscrição</button>
      </p>
    </form>
  </main>

  <footer>
    <p>Contacto do clube: <a href="mailto:clube.fotografia@exemplo.pt">clube.fotografia@exemplo.pt</a></p>
  </footer>
</body>
</html>
